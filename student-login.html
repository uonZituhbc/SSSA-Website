<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | SSSA — University of Eldoret</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-section {
            min-height: 75vh;
            padding: 70px 20px;
            background: #f5f8fc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .login-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-heading h1 {
            color: #064789;
            margin-bottom: 8px;
        }

        .login-heading p {
            color: #666;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccd6e0;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #064789;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #064789;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover {
            background: #043563;
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-message {
            display: none;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .login-message.error {
            display: block;
            background: #ffe8e8;
            color: #b00020;
        }

        .login-message.success {
            display: block;
            background: #e8f8ee;
            color: #16733b;
        }

        .login-links {
            text-align: center;
            margin-top: 22px;
        }

        .login-links a {
            color: #064789;
            text-decoration: none;
            font-weight: 600;
        }

        .login-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="container">

        <div class="logo">
            <a href="index.html">SSSA</a>
        </div>

        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="departments.html">Departments</a>
            <a href="association.html">Association</a>
            <a href="leadership.html">Leadership</a>
            <a href="events.html">Events</a>
            <a href="student-profile.html">Create Profile</a>
            <a href="student-profile-view.html">My Profile</a>
            <a href="registration.html">Membership</a>
            <a href="contact.html">Contact</a>
        </nav>

    </div>
</header>


<section class="login-section">

    <div class="login-card">

        <div class="login-heading">
            <h1>Student Login</h1>
            <p>Access your SSSA student profile</p>
        </div>

        <div id="loginMessage" class="login-message"></div>

        <form id="studentLoginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>

        </form>


        <div class="login-links">

            <p>
                Don't have an account?
                <a href="student-signup.html">
                    Create Account
                </a>
            </p>

            <p style="margin-top:12px;">
                <a href="student-profile-view.html">
                    View Profile
                </a>
            </p>

        </div>

    </div>

</section>


<footer>
    <div class="container">
        <p>
            &copy;
            <span id="currentYear"></span>
            SSSA — University of Eldoret.
            All Rights Reserved.
        </p>
    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/student-login.js"></script>

<script>
    document.getElementById("currentYear").textContent =
        new Date().getFullYear();
</script>

</body>
</html>
